[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md2docx"
version = "1.0.0"
description = "Convert Markdown to .docx with formatting driven by a config file"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Robert August Vincent II", email = "pillarsdotnet@gmail.com" },
]
keywords = ["markdown", "docx", "pandoc", "reference-docx"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

# Only the standard library is required; PyYAML is used when present so that
# YAML configuration files work too.
[project.optional-dependencies]
yaml = ["PyYAML"]

[project.scripts]
md2docx = "md2docx:main"

[project.urls]
Homepage = "https://forgejo.bobbalisa.org/pillarsdotnet/md2docx"
Source = "https://forgejo.bobbalisa.org/pillarsdotnet/md2docx"

[tool.setuptools]
py-modules = ["md2docx"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Enable the entire Ruff rule set; suppress only mutually-incompatible rules.
select = ["ALL"]
ignore = [
    "D203",  # conflicts with D211 — keep D211 (no blank line before class docstring)
    "D213",  # conflicts with D212 — keep D212 (summary on first line)
]

[tool.mypy]
# Pin the target so mypy checks the language level we actually support
# (requires-python) instead of whatever interpreter happens to run the hook.
python_version = "3.10"
files = ["md2docx.py"]
ignore_missing_imports = false
warn_unused_ignores = true
